name: Pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.action != 'closed' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      PREVIEW_HOST: vahor-fr-pr-${{ github.event.pull_request.number }}.preview.vahor.fr
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/vahor/vahor.fr:sha-${{ github.event.pull_request.head.sha }}
          build-args: |
            BUILD_TIME=${{ github.event.pull_request.updated_at }}
            NEXT_PUBLIC_VERCEL_ENV=preview
            NEXT_PUBLIC_VERCEL_URL=${{ env.PREVIEW_HOST }}
          cache-from: type=gha,scope=vahor-fr
          cache-to: type=gha,scope=vahor-fr,mode=min

      - name: Deploy preview
        uses: vahor-org/ansible-configs/.github/actions/preview@main
        with:
          action: preview-deploy
          app: vahor-fr
          pr: ${{ github.event.pull_request.number }}
          sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.VAHOR_BOT_TOKEN }}
          ansible-deploy-ssh-key: ${{ secrets.ANSIBLE_DEPLOY_SSH_KEY }}
          ansible-ssh-known-hosts: ${{ secrets.ANSIBLE_SSH_KNOWN_HOSTS }}
          ghcr-token: ${{ secrets.GHCR_TOKEN }}
          ghcr-username: ${{ secrets.GHCR_USERNAME }}

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vahor-preview
          message: |
            ✅ Preview: https://${{ env.PREVIEW_HOST }}/

      - name: Remove preview
        uses: vahor-org/ansible-configs/.github/actions/preview@main
        with:
          action: preview-remove
          app: vahor-fr
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.VAHOR_BOT_TOKEN }}
          ansible-deploy-ssh-key: ${{ secrets.ANSIBLE_DEPLOY_SSH_KEY }}
          ansible-ssh-known-hosts: ${{ secrets.ANSIBLE_SSH_KNOWN_HOSTS }}
          ghcr-token: ${{ secrets.GHCR_TOKEN }}
          ghcr-username: ${{ secrets.GHCR_USERNAME }}
